server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Encaminha o link universal (/join/slug) para o backend processar
    location /join/ {
        proxy_pass http://backend:8000/join/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Suporte para SPA (React Router / Navegação por Abas)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para arquivos estáticos (melhora performance)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Erros personalizados (opcional)
    error_page 404 /index.html;
}
